<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Branding Zombie vs The Marketing Menace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1e2433; --navy-deep:#161b28; --gold:#e9b44c; --gold-dark:#8a5a20;
    --parchment:#efe3c4; --blood:#c23b3b; --slime:#7fb069; --steel:#5a6478;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--navy-deep);overflow:hidden;
    font-family:'VT323',monospace;color:var(--parchment)}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(ellipse at 50% 120%, #232b3f 0%, var(--navy-deep) 60%);}
  #frame{position:relative;width:min(100vw, calc(100vh * 2.37));
    aspect-ratio:1280/540;box-shadow:0 0 0 4px #0c0f18, 0 0 60px rgba(0,0,0,.7);}
  canvas{width:100%;height:100%;display:block;image-rendering:pixelated;
    image-rendering:crisp-edges;background:var(--navy);cursor:pointer}
  #mute{position:absolute;top:10px;right:12px;z-index:5;background:var(--navy);
    border:2px solid var(--steel);color:var(--parchment);font-family:'Press Start 2P',monospace;
    font-size:10px;padding:8px 10px;cursor:pointer;opacity:.85}
  #mute:hover{border-color:var(--gold);color:var(--gold)}
  #mute:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  @media (max-width:700px){ #mute{font-size:8px;padding:6px 8px} }
  #overlay{position:absolute;inset:0;display:none;z-index:4;pointer-events:none}
  #overlay.show{display:block}
  #overlay .btnrow{position:absolute;left:0;right:0;top:71%;display:flex;
    gap:2.5%;justify-content:center;pointer-events:none}
  .pxbtn{pointer-events:auto;font-family:'Press Start 2P',monospace;font-size:clamp(8px,1.35vw,15px);
    padding:1.1em 1.6em;cursor:pointer;border:3px solid;letter-spacing:1px;
    text-decoration:none;display:inline-block;transition:transform .08s}
  .pxbtn:hover{transform:translateY(-2px)}
  .pxbtn:active{transform:translateY(1px)}
  .pxbtn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  #shareBtn{background:#e9b44c;color:#3a2810;border-color:#8a5a20}
  #againBtn{background:#6b7355;color:#efe3c4;border-color:#3a3f2c}
  #siteLink{position:absolute;left:0;right:0;top:88%;text-align:center;pointer-events:none}
  #siteLink a{pointer-events:auto;font-family:'VT323',monospace;color:var(--gold);
    font-size:clamp(14px,2.4vw,30px);text-decoration:none;border-bottom:2px dotted var(--gold-dark)}
  #siteLink a:hover{color:#f5cd7a}
  #toast{position:absolute;left:50%;top:62%;transform:translateX(-50%);
    background:#161b28;border:2px solid var(--slime);color:var(--slime);
    font-family:'Press Start 2P',monospace;font-size:clamp(8px,1.2vw,13px);
    padding:.8em 1.2em;opacity:0;transition:opacity .25s;pointer-events:none}
  #toast.show{opacity:1}
</style>
</head>
<body>
<div id="wrap">
  <div id="frame">
    <canvas id="game" width="1280" height="540" aria-label="The Branding Zombie endless runner game"></canvas>
    <button id="mute" aria-label="Toggle sound">SOUND: ON</button>
    <div id="overlay">
      <div class="btnrow">
        <button id="shareBtn" class="pxbtn">SHARE SCORE</button>
        <button id="againBtn" class="pxbtn">PLAY AGAIN</button>
      </div>
      <div id="siteLink"><a href="https://brandingzombiedesigns.com" target="_blank" rel="noopener">brandingzombiedesigns.com</a></div>
      <div id="toast">SCORE COPIED! GO PASTE IT SOMEWHERE.</div>
    </div>
  </div>
</div>

/* ---------- image loading ---------- */
const IMG = {};
let toLoad = 0, loaded = 0;
function loadImg(key, src){
  toLoad++;
  const im = new Image();
  im.onload = ()=>{ loaded++; };
  im.onerror = ()=>{ loaded++; };
  im.src = src;
  IMG[key] = im;
}
ASSETS.walk.forEach((s,i)=>loadImg("walk"+i,s));
ASSETS.jump.forEach((s,i)=>loadImg("jump"+i,s));
ASSETS.duck.forEach((s,i)=>loadImg("duck"+i,s));
loadImg("hit0",ASSETS.hit[0]);
ASSETS.dead.forEach((s,i)=>loadImg("dead"+i,s));
loadImg("atk0",ASSETS.atk[0]);
ASSETS.thumb.forEach((s,i)=>loadImg("thumb"+i,s));

const cv = document.getElementById("game");

/* ---------- audio (synthesized, no files) ---------- */
let AC = null, muted = false;
function ac(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function tone(freq, dur, type="square", vol=.12, slide=0){
  if(muted) return;
  try{
    const a = ac(), o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, a.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), a.currentTime+dur);
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime+dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime+dur);
  }catch(e){}
}
function sfxJump(){ tone(220,.18,"square",.10,340); }
function sfxChomp(){ tone(160,.09,"sawtooth",.14,-90); setTimeout(()=>tone(90,.10,"square",.12,-40),50); }
function sfxHit(){ tone(300,.25,"sawtooth",.16,-240); }
function sfxDead(){ [392,330,262,196,131].forEach((f,i)=>setTimeout(()=>tone(f,.22,"triangle",.14),i*140)); }
function sfxStart(){ [262,330,392,523].forEach((f,i)=>setTimeout(()=>tone(f,.12,"square",.10),i*90)); }
function sfxMile(){ tone(660,.09,"square",.08); setTimeout(()=>tone(880,.12,"square",.08),80); }
function sfxPower(){ [392,523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,.10,"square",.10),i*60)); }
function sfxShieldUp(){ tone(330,.14,"triangle",.12,180); setTimeout(()=>tone(660,.18,"triangle",.10),110); }
function sfxShieldBreak(){ tone(500,.12,"sawtooth",.14,-300); setTimeout(()=>tone(180,.2,"square",.12,-80),90); }
function sfxBad(){ [300,210,140].forEach((f,i)=>setTimeout(()=>tone(f,.16,"sawtooth",.13,-40),i*110)); }
function sfxSlime(){ tone(95,.22,"sawtooth",.14,-45); setTimeout(()=>tone(70,.18,"square",.10,-20),120); }
function sfxThunder(){ tone(55,.6,"sawtooth",.11,-25); setTimeout(()=>tone(40,.5,"triangle",.08,-10),180); }

/* ---------- share ---------- */
const SHARE_URL = "https://brandingzombiedesigns.com/play";
const overlay = document.getElementById("overlay");
const toast = document.getElementById("toast");
let toastTimer = null;

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove("show"), 2200);
}
function shareText(){
  return "I scored " + Math.round(points).toLocaleString() + " pts as THE BRANDING ZOMBIE \u{1F9DF} " +
    (dist|0) + "m survived, " + flyersEaten + " bad AI flyers devoured before my brand went DEFUNCT. " +
    "Think you can outrun the Marketing Menace?";
}
document.getElementById("shareBtn").addEventListener("click", async e=>{
  e.stopPropagation();
  const text = shareText();
  if(navigator.share){
    try{ await navigator.share({ title:"The Branding Zombie", text, url:SHARE_URL }); return; }
    catch(err){ if(err && err.name==="AbortError") return; }
  }
  try{
    await navigator.clipboard.writeText(text + " " + SHARE_URL);
    showToast("SCORE COPIED! GO PASTE IT SOMEWHERE.");
  }catch(err){
    showToast("COPY BLOCKED \u2014 SCREENSHOT IT INSTEAD!");
  }
});
document.getElementById("againBtn").addEventListener("click", e=>{
  e.stopPropagation();
  startGame();
});
function syncOverlay(){
  overlay.classList.toggle("show", state===S.OVER);
}

const muteBtn = document.getElementById("mute");
muteBtn.addEventListener("click", e=>{
  e.stopPropagation();
  muted = !muted;
  muteBtn.textContent = "SOUND: " + (muted?"OFF":"ON");
});

function notifyParent(msg){ try{ if(parent !== window) parent.postMessage(Object.assign({source:"bzr"}, msg), location.origin); }catch(e){} }
let spawnTimer, flyerTimer, shake, mileFlash;
let bgX, bgMode, bgFade, nextSwapDist;
let player, obstacles, pickups, particles, popups;
let deathTimer = 0, gameOverQuip = "";

const QUIPS = [
  "Another brand lost to the Corporate Identity Cemetery.",
  "That campaign flopped harder than a QR code menu.",
  "You won't believe this one weird trick: hiring a real designer.",
  "Cause of death: 50% OFF CHEAP.",
  "Brand status: DEFUNCT. It didn't have to be this way.",
  "The Marketing Menace claims another victim.",
  "Slipped on AI slop. Happens to the best brands.",
  "The spam flyers got you. They always do."
];

let runFrames = 0, countdown = 0, dodgeStreak = 0, speedBoost = 0;
/* powerups / debuffs / environment */
let powerups, hazards, buffs, puTimer, hazTimer;
let slimed = 0, sickTimer = 0, lightning = 0, boltTimer = 0, fogs = [], ambient = [];
function resetRun(){
  runFrames = 0; countdown = 195; dodgeStreak = 0; speedBoost = 0;
  speed = 6.2; dist = 0; points = 0; flyersEaten = 0; hearts = 3;
  spawnTimer = 90; flyerTimer = 160; shake = 0; mileFlash = 0;
  bgX = 0; bgMode = 0; bgFade = 0; nextSwapDist = 1000;
  obstacles = []; pickups = []; particles = []; popups = [];
  powerups = []; hazards = []; puTimer = 700; hazTimer = 520;
  buffs = { x2:0, magnet:0, shield:false };
  slimed = 0; sickTimer = 0; lightning = 0; boltTimer = 0; fogs = []; ambient = [];
  player = {
    x:150, y:GROUND, vy:0, w:64, h:105,
    ducking:false, jumping:false, jumpCut:false, frame:0, animT:0,
    invuln:0, eatFlash:0
  };
}
resetRun();

/* ---------- input ----------
   JUMP: space / up / W / press right side of screen. Hold = jump higher.
   DUCK: down / S / hold left side of screen.                        */
const keys = {};
let duckKey = false;
const pointers = new Map();   // pointerId -> "jump" | "duck"

function pressJump(){
  if(state===S.TITLE){ startGame(); return; }
  if(state===S.OVER){ if(deathTimer<=0) startGame(); return; }
  if(state!==S.PLAY || countdown > 0) return;
  if(!player.jumping && !player.ducking){
    player.jumping = true; player.jumpCut = false; player.vy = -14; sfxJump();
  }
}
function releaseJump(){
  // cut the jump short if released while still rising -> variable height
  if(player.jumping && player.vy < -3 && !player.jumpCut){
    player.vy *= .5; player.jumpCut = true;
  }
}
window.addEventListener("keydown", e=>{
  if(e.code==="Escape") notifyParent({event:"esc"});
  if(["Space","ArrowUp","ArrowDown","KeyW","KeyS"].includes(e.code)) e.preventDefault();
  if(keys[e.code]) return;
  keys[e.code] = true;
  if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW") pressJump();
  if(e.code==="ArrowDown"||e.code==="KeyS") duckKey = true;
});
window.addEventListener("keyup", e=>{
  keys[e.code] = false;
  if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW") releaseJump();
  if(e.code==="ArrowDown"||e.code==="KeyS") duckKey = false;
});
function pointerZone(e){
  const r = cv.getBoundingClientRect();
  return (e.clientX - r.left) / r.width < .38 ? "duck" : "jump";
}
cv.addEventListener("pointerdown", e=>{
  e.preventDefault();
  if(state!==S.PLAY){ pressJump(); return; }
  const z = pointerZone(e);
  pointers.set(e.pointerId, z);
  if(z==="jump") pressJump();
});
function pointerEnd(e){
  const z = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if(z==="jump") releaseJump();
}
cv.addEventListener("pointerup", pointerEnd);
cv.addEventListener("pointercancel", pointerEnd);
window.addEventListener("blur", ()=>{ pointers.clear(); duckKey=false; });

function inputJumpHeld(){
  if(keys["Space"]||keys["ArrowUp"]||keys["KeyW"]) return true;
  for(const z of pointers.values()) if(z==="jump") return true;
  return false;
}
function inputDuckHeld(){
  if(duckKey) return true;
  for(const z of pointers.values()) if(z==="duck") return true;
  return false;
}

function startGame(){
  notifyParent({event:"game_start"});
  resetRun();
  state = S.PLAY;
  sfxStart();
}

/* ---------- spawning ---------- */
const GROUND_ENEMIES = [
  { key:"en_badlogo",  h:118, hb:.62 },
  { key:"en_officer",  h:126, hb:.60 },
  { key:"en_clickbait",h:118, hb:.62 },
  { key:"en_slop",     h:122, hb:.62, minDist:600 },  // the AI Slop Monster joins later runs
];
function spawnObstacle(){
  // never demand a duck right on top of a slime puddle (duck+jump conflict)
  const hazardNear = hazards.some(z=>z.x > W-380);
  const flying = !hazardNear && Math.random() < Math.min(.34, .12 + dist/9000);
  if(flying){
    // The Tight-Fisted Customer swoops at head height: duck under him
    const im = IMG["en_customer"];
    const h = 96, w = Math.round(h*im.width/im.height);
    obstacles.push({ key:"en_customer", x:W+80, w, h, phase:(Math.random()*22)|0,
      baseY: GROUND-78, bob: Math.random()*Math.PI*2, flying:true, hb:.6 });
  }else{
    const pool = GROUND_ENEMIES.filter(g=>!g.minDist || dist>=g.minDist);
    const e = pool[(Math.random()*pool.length)|0];
    const im = IMG[e.key];
    const w = Math.round(e.h*im.width/im.height);
    obstacles.push({ key:e.key, x:W+80, w, h:e.h, baseY:GROUND, flying:false, hb:e.hb, phase:(Math.random()*22)|0 });
  }
}
function spawnFlyers(){
  // a row or arc of tasty bad-AI flyers
  const n = 2 + (Math.random()*3|0);
  const arc = Math.random() < .5;
  const yBase = arc ? GROUND-150 : (Math.random()<.5 ? GROUND-6 : GROUND-110);
  for(let i=0;i<n;i++){
    const y = arc ? yBase - Math.sin((i/(n-1))*Math.PI)*55 : yBase;
    // past 400m the Menace slips rotten SPAM flyers into the rows — don't eat those
    const cursed = dist > 400 && Math.random() < .16;
    pickups.push({ x:W+80+i*74, y, w:44, h:52, wob:Math.random()*6.28, cursed });
  }
}

/* ---------- powerups & hazards ---------- */
const PU_TYPES = ["coffee","shield","magnet","heart"];
function spawnPowerup(){
  let type = PU_TYPES[(Math.random()*4)|0];
  if(type==="heart" && hearts>=3) type = ["coffee","shield","magnet"][(Math.random()*3)|0];
  const y = GROUND - 100 - Math.random()*70;
  powerups.push({ type, x:W+80, y, w:46, h:46, wob:Math.random()*6.28 });
}
function spawnHazard(){
  // slime puddle: no heart loss, but it kills your momentum. Jump it.
  if(obstacles.some(o=>o.flying && o.x > W-420)) return;
  hazards.push({ x:W+80, w:104+Math.random()*40, h:22, bub:Math.random()*6.28 });
}

/* ---------- environment: day/night + weather ---------- */
function nightAmt(){
  // a full day lasts 2400m; night falls in the back half of each cycle
  const c = dist % 2400;
  if(c < 1200) return 0;
  if(c < 1450) return (c-1200)/250;
  if(c < 2150) return 1;
  return 1 - (c-2150)/250;
}
function hitTest(a, b, shrink){
  const sx = b.w*(1-shrink)/2, sy = b.h*(1-shrink)/2;
  return a.x < b.x+b.w-sx && a.x+a.w > b.x+sx &&
         a.y < b.y+b.h-sy && a.y+a.h > b.y+sy;
}

/* ---------- update ---------- */
function update(){
  t++;
  if(shake>0) shake *= .85;
  if(mileFlash>0) mileFlash--;

  if((state===S.PLAY && countdown<=0) || state===S.DYING){
    const sp = state===S.PLAY ? speed : speed*.4;
    bgX = (bgX + sp*.45);
    dist += sp/28;
  }

  if(state===S.PLAY && countdown > 0){
    countdown--;
    if(countdown % 65 === 0 && countdown > 0) tone(440,.12,"square",.10);
    if(countdown === 0){ tone(880,.22,"square",.12); }
    return;   // world is frozen until GO
  }

  if(state===S.PLAY){
    runFrames++;
    speed = Math.max(4, Math.min(15, 6.2 + dist/600 + speedBoost - (slimed>0 ? 1.7 : 0)));

    // buff / debuff clocks
    if(buffs.x2>0 && t%5===0) particles.push({
      x:player.x+Math.random()*player.w, y:player.y-Math.random()*player.h,
      vx:-1.5-Math.random(), vy:-.5, life:18+Math.random()*10, s:2+Math.random()*2, col:"#f5cd7a"
    });
    if(buffs.x2>0) buffs.x2--;
    if(buffs.magnet>0) buffs.magnet--;
    if(slimed>0) slimed--;
    if(sickTimer>0) sickTimer--;

    // background scene swap
    if(dist > nextSwapDist){ bgMode ^= 1; nextSwapDist += 1000 + Math.random()*500; bgFade = 1; }
    if(bgFade>0) bgFade = Math.max(0, bgFade-.02);

    // player physics: lighter gravity while jump is held and rising = higher jump
    if(player.jumping){
      const rising = player.vy < 0;
      player.vy += (rising && inputJumpHeld() && !player.jumpCut) ? .46 : .95;
      player.y += player.vy;
      if(player.y >= GROUND){ player.y = GROUND; player.jumping=false; player.vy=0; player.jumpCut=false; }
    }
    player.ducking = !player.jumping && inputDuckHeld();
    player.h = player.ducking ? 72 : 105;
    player.w = player.ducking ? 84 : 64;
    if(player.invuln>0) player.invuln--;
    if(player.eatFlash>0) player.eatFlash--;
    player.animT += speed*.021;

    // spawns
    if(--spawnTimer<=0){
      spawnObstacle();
      spawnTimer = Math.max(46, 105 - dist/40) + Math.random()*45;
    }
    if(--flyerTimer<=0){
      spawnFlyers();
      flyerTimer = 200 + Math.random()*180;
    }
    if(--puTimer<=0){
      spawnPowerup();
      puTimer = 850 + Math.random()*550;
    }
    if(dist > 250 && --hazTimer<=0){
      spawnHazard();
      hazTimer = 480 + Math.random()*420;
    }

    // milestone
    if(((dist|0) % 500) === 0 && (dist|0)>0 && mileFlash===0){ mileFlash=45; sfxMile(); }

    // storm bolts over the cemetery at night
    if(nightAmt()>.5 && bgMode===1){
      if(--boltTimer<=0){ lightning = 10; sfxThunder(); boltTimer = 260 + Math.random()*480; }
    }
    if(lightning>0) lightning--;

    // ambient drift: paper scraps by day, fog wisps in the cemetery
    if(bgMode===1 && fogs.length < 6 && Math.random()<.02)
      fogs.push({ x:W+120, y:GROUND-20-Math.random()*130, w:150+Math.random()*140, h:26+Math.random()*20, v:.4+Math.random()*.5, a:.05+Math.random()*.08 });
    for(let i=fogs.length-1;i>=0;i--){
      fogs[i].x -= speed*fogs[i].v;
      if(fogs[i].x + fogs[i].w < -60) fogs.splice(i,1);
    }
    if(bgMode===0 && ambient.length < 5 && Math.random()<.02)
      ambient.push({ x:W+30, y:80+Math.random()*(GROUND-140), s:3+Math.random()*3, v:.6+Math.random()*.7, ph:Math.random()*6.28 });
    for(let i=ambient.length-1;i>=0;i--){
      const a = ambient[i];
      a.x -= speed*a.v; a.ph += .08; a.y += Math.sin(a.ph)*.7;
      if(a.x < -20) ambient.splice(i,1);
    }

    // move & collide obstacles
    const pbox = { x:player.x, y:player.y-player.h, w:player.w, h:player.h };
    for(let i=obstacles.length-1;i>=0;i--){
      const o = obstacles[i];
      o.x -= speed;
      if(o.flying){ o.bob += .07; o.y = o.baseY - o.h + Math.sin(o.bob)*10; }
      else o.y = o.baseY - o.h;
      if(o.x + o.w < -40){ obstacles.splice(i,1); continue; }
      if(!o.dodged && !o.hitPlayer && o.x + o.w < player.x - 8){
        o.dodged = true; dodgeStreak++;
        if(dodgeStreak % 4 === 0){
          speedBoost = Math.min(3.6, speedBoost + .45);
          popups.push({x:player.x+40, y:player.y-player.h-30, txt:"SPEED UP!", life:50, col:"#7fb069"});
          tone(520,.08,"square",.09); setTimeout(()=>tone(780,.1,"square",.09),70);
        }
      }
      if(player.invuln===0 && hitTest(pbox, o, o.hb)){
        o.hitPlayer = true;
        if(buffs.shield){
          // brand armor eats the hit; streak survives
          buffs.shield = false; player.invuln = 70; shake = 6;
          popups.push({x:player.x+34, y:player.y-player.h-24, txt:"ARMOR SAVED YOU!", life:48, col:"#7ec8e3"});
          for(let k=0;k<12;k++) particles.push({
            x:player.x+player.w/2, y:player.y-player.h/2,
            vx:(Math.random()-.5)*7, vy:(Math.random()-.7)*6,
            life:26+Math.random()*16, s:3+Math.random()*3, col:"#7ec8e3"
          });
          sfxShieldBreak();
          continue;
        }
        hearts--; player.invuln = 95; shake = 11; sfxHit();
        if(dodgeStreak >= 4)
          popups.push({x:player.x+30, y:player.y-player.h-38, txt:"STREAK LOST", life:44, col:"#8b93a8"});
        dodgeStreak = 0; speedBoost = Math.max(0, speedBoost - .9);
        popups.push({x:player.x+30, y:player.y-player.h-14, txt:"OUCH!", life:40, col:"#e05a5a"});
        if(hearts<=0){
          state = S.DYING; deathTimer = 0;
          gameOverQuip = QUIPS[(Math.random()*QUIPS.length)|0];
          sfxDead();
        }
      }
    }
    // pickups
    for(let i=pickups.length-1;i>=0;i--){
      const p = pickups[i];
      p.x -= speed; p.wob += .1;
      // brain magnet reels in the GOOD flyers (spam stays put — it wants you to come to it)
      if(buffs.magnet>0 && !p.cursed){
        const dx = (player.x+player.w/2) - (p.x+p.w/2), dy = (player.y-player.h/2) - (p.y-p.h/2);
        const d = Math.hypot(dx,dy);
        if(d < 300){ p.x += dx/d*7.5; p.y += dy/d*7.5; }
      }
      if(p.x + p.w < -40){ pickups.splice(i,1); continue; }
      const pb = { x:p.x, y:p.y-p.h, w:p.w, h:p.h };
      if(hitTest(pbox, pb, .95)){
        pickups.splice(i,1);
        if(p.cursed){
          points = Math.max(0, points-100); sickTimer = 40;
          if(dodgeStreak >= 4)
            popups.push({x:p.x, y:p.y-p.h-30, txt:"STREAK LOST", life:44, col:"#8b93a8"});
          dodgeStreak = 0;
          popups.push({x:p.x, y:p.y-p.h-8, txt:"EW! SPAM! -100", life:48, col:"#8fd14f"});
          for(let k=0;k<10;k++) particles.push({
            x:p.x+p.w/2, y:p.y-p.h/2,
            vx:(Math.random()-.5)*5, vy:-Math.random()*4-1,
            life:26+Math.random()*18, s:3+Math.random()*3, col:"#8fd14f"
          });
          sfxBad();
          continue;
        }
        const gain = buffs.x2>0 ? 300 : 150;
        flyersEaten++; points += gain; player.eatFlash = 14;
        sfxChomp();
        popups.push({x:p.x, y:p.y-p.h-8, txt:"NOM! +"+gain, life:44, col:"#e9b44c"});
        for(let k=0;k<8;k++) particles.push({
          x:p.x+p.w/2, y:p.y-p.h/2,
          vx:(Math.random()-.3)*5, vy:-Math.random()*5-1,
          life:30+Math.random()*20, s:3+Math.random()*4
        });
      }
    }
    // powerups drift in like the flyers do
    for(let i=powerups.length-1;i>=0;i--){
      const p = powerups[i];
      p.x -= speed; p.wob += .08;
      if(p.x + p.w < -40){ powerups.splice(i,1); continue; }
      const pb = { x:p.x, y:p.y-p.h, w:p.w, h:p.h };
      if(hitTest(pbox, pb, 1.05)){
        powerups.splice(i,1);
        if(p.type==="coffee"){
          buffs.x2 = 600;
          popups.push({x:p.x, y:p.y-p.h-8, txt:"CAFFEINE RUSH! 2x PTS", life:54, col:"#e9b44c"});
          sfxPower();
        }else if(p.type==="shield"){
          buffs.shield = true;
          popups.push({x:p.x, y:p.y-p.h-8, txt:"BRAND ARMOR!", life:54, col:"#7ec8e3"});
          sfxShieldUp();
        }else if(p.type==="magnet"){
          buffs.magnet = 480;
          popups.push({x:p.x, y:p.y-p.h-8, txt:"BRAIN MAGNET!", life:54, col:"#d98cc4"});
          sfxPower();
        }else{
          hearts = Math.min(3, hearts+1);
          popups.push({x:p.x, y:p.y-p.h-8, txt:"+1 HEART!", life:54, col:"#d94141"});
          sfxPower();
        }
        for(let k=0;k<10;k++) particles.push({
          x:p.x+p.w/2, y:p.y-p.h/2,
          vx:(Math.random()-.5)*6, vy:(Math.random()-.8)*5,
          life:28+Math.random()*16, s:2+Math.random()*3, col:"#f5cd7a"
        });
      }
    }
    // slime puddles: touch one on the ground and your momentum dies
    for(let i=hazards.length-1;i>=0;i--){
      const z = hazards[i];
      z.x -= speed; z.bub += .12;
      if(z.x + z.w < -40){ hazards.splice(i,1); continue; }
      if(slimed===0 && !player.jumping &&
         player.x < z.x+z.w-14 && player.x+player.w > z.x+14){
        slimed = 180; sickTimer = 30;
        if(dodgeStreak >= 4)
          popups.push({x:player.x+30, y:player.y-player.h-38, txt:"STREAK LOST", life:44, col:"#8b93a8"});
        dodgeStreak = 0; speedBoost = Math.max(0, speedBoost - .9);
        popups.push({x:player.x+30, y:player.y-player.h-14, txt:"SLIMED!", life:46, col:"#8fd14f"});
        for(let k=0;k<8;k++) particles.push({
          x:player.x+player.w/2, y:player.y-6,
          vx:(Math.random()-.5)*4, vy:-Math.random()*4,
          life:24+Math.random()*14, s:3+Math.random()*3, col:"#8fd14f"
        });
        sfxSlime();
      }
    }
    points += speed*.028 * (buffs.x2>0 ? 2 : 1);
  }

  if(state===S.DYING){
    deathTimer++;
    if(player.y < GROUND){ player.vy+=.82; player.y+=player.vy; if(player.y>GROUND) player.y=GROUND; }
    if(deathTimer > 80){
      state = S.OVER; deathTimer = 40; // reuse as input lockout
      best = Math.max(best, Math.round(points));
      try{ localStorage.setItem("bzr-best", String(best)); }catch(e){}
      notifyParent({event:"game_over", score:Math.round(points), dist:dist|0, flyers:flyersEaten});
    }
  }
  if(state===S.OVER && deathTimer>0) deathTimer--;

  // particles & popups always tick
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=.3; p.life--;
    if(p.life<=0) particles.splice(i,1);
  }
  for(let i=popups.length-1;i>=0;i--){
    const p = popups[i];
    p.y -= .8; p.life--;
    if(p.life<=0) popups.splice(i,1);
  }
}

/* ---------- drawing helpers ---------- */
function px(font){ cx.font = font + "px 'Press Start 2P', monospace"; }
function vt(font){ cx.font = font + "px 'VT323', monospace"; }
function outlineText(txt,x,y,fill,outline,ow){
  cx.lineWidth = ow; cx.strokeStyle = outline; cx.lineJoin="round";
  cx.strokeText(txt,x,y); cx.fillStyle = fill; cx.fillText(txt,x,y);
}
function pxSprite(rows, x, y, s, pal){
  for(let r=0;r<rows.length;r++)
    for(let c=0;c<rows[r].length;c++){
      const ch = rows[r][c];
      if(ch==="."||ch===" ") continue;
      cx.fillStyle = pal[ch];
      cx.fillRect(x+c*s, y+r*s, s, s);
    }
}
const ICONS = {
  coffee: { rows:["..a.a..",".a.a...",".......",".ooooo.",".owwwob",".ooooob",".ooooo.","..ooo.."],
            pal:{a:"#efe3c4",o:"#e9b44c",w:"#4a2f1e",b:"#8a5a20"}, glow:"#e9b44c" },
  shield: { rows:[".sssss.","sbbbbbs","sbzzzbs","sbbzbbs","sbzzzbs",".sbbbs.","..sss..","...s..."],
            pal:{s:"#7ec8e3",b:"#2c4a63",z:"#efe3c4"}, glow:"#7ec8e3" },
  magnet: { rows:["ww...ww","rr...rr","rr...rr","rr...rr","rrr.rrr",".rrrrr.","..rrr.."],
            pal:{r:"#c23b3b",w:"#efe3c4"}, glow:"#d98cc4" },
  heart:  { rows:[], pal:{}, glow:"#d94141" }
};
function drawPowerupIcon(type, x, y, s){
  if(type==="heart"){ heart(x, y, s, true); return; }
  const ic = ICONS[type];
  pxSprite(ic.rows, x, y, s, ic.pal);
}
function heart(x,y,s,full){
  cx.fillStyle = full ? "#d94141" : "#3a4054";
  cx.fillRect(x+s,y,s*2,s); cx.fillRect(x+s*4,y,s*2,s);
  cx.fillRect(x,y+s,s*7,s*2); cx.fillRect(x+s,y+s*3,s*5,s);
  cx.fillRect(x+s*2,y+s*4,s*3,s); cx.fillRect(x+s*3,y+s*5,s,s);
  if(full){ cx.fillStyle="#f08080"; cx.fillRect(x+s,y+s,s,s); }
}

let cursedCv = null;
function cursedFlyer(){
  // one-time green-rot recolor of the flyer sprite
  const im = IMG["flyer"];
  if(cursedCv) return cursedCv;
  if(!im.width) return im;
  cursedCv = document.createElement("canvas");
  cursedCv.width = im.width; cursedCv.height = im.height;
  const c = cursedCv.getContext("2d");
  c.drawImage(im,0,0);
  c.globalCompositeOperation = "source-atop";
  c.fillStyle = "rgba(94,168,52,.55)";
  c.fillRect(0,0,im.width,im.height);
  return cursedCv;
}

function drawNight(){
  const na = nightAmt();
  if(na<=0) return;
  cx.fillStyle = "rgba(10,14,38,"+(.42*na).toFixed(3)+")";
  cx.fillRect(0,0,W,H);
  if(na>.3){
    cx.globalAlpha = (na-.3)/.7;
    // moon
    cx.fillStyle = "#e8e2c8"; cx.beginPath(); cx.arc(W-160, 86, 26, 0, 6.29); cx.fill();
    cx.fillStyle = "rgba(10,14,38,.55)"; cx.beginPath(); cx.arc(W-172, 78, 22, 0, 6.29); cx.fill();
    // stars (deterministic scatter, slow twinkle)
    cx.fillStyle = "#efe3c4";
    for(let i=0;i<26;i++){
      const sx = (i*257+61)%W, sy = (i*113+17)%150;
      if(((t>>4)+i)%7===0) continue;
      cx.fillRect(sx, sy, 2, 2);
    }
    cx.globalAlpha = 1;
  }
}

function drawBG(){
  const modes = ["bg_day","bg_grave"];
  const im = IMG[modes[bgMode]];
  const alt = IMG[modes[bgMode^1]];
  const scale = H / im.height;
  const bw = Math.round(im.width*scale);
  const off = Math.floor(bgX % bw);
  cx.drawImage(im, -off, 0, bw, H);
  cx.drawImage(im, -off+bw, 0, bw, H);
  // seam divider styled like the scene's section walls
  cx.fillStyle = "#1b202d";
  cx.fillRect(-off+bw-4, 92, 9, H-92);
  cx.fillRect(-off-4, 92, 9, H-92);
  if(bgFade>0){
    cx.globalAlpha = bgFade;
    cx.drawImage(alt, -off, 0, bw, H);
    cx.drawImage(alt, -off+bw, 0, bw, H);
    cx.globalAlpha = 1;
  }
}

function drawPlayer(){
  let im, drawH;
  if(state===S.DYING || state===S.OVER){
    im = (state===S.OVER || deathTimer>55) ? IMG["dead1"] : IMG["dead0"];
    drawH = im===IMG["dead1"] ? 52 : 100;
  } else if(player.invuln>60){
    im = IMG["hit0"]; drawH = 105;
  } else if(player.eatFlash>0){
    im = IMG["atk0"]; drawH = 105;
  } else if(player.jumping){
    im = player.vy<0 ? IMG["jump1"] : IMG["jump2"]; drawH = 108;
  } else if(player.ducking){
    im = IMG["duck"+((player.animT*1.5|0)%2)]; drawH = 76;
  } else {
    im = IMG["walk"+((player.animT|0)%5)]; drawH = 108;
  }
  if(player.invuln>0 && player.invuln<=60 && (t>>2)%2===0) return; // blink
  const w = Math.round(drawH*im.width/im.height);
  cx.drawImage(im, player.x - (w-player.w)/2, player.y - drawH, w, drawH);
}

function drawHUD(){
  // panel echoes the HUD mockup: steel border, navy fill
  cx.fillStyle = "rgba(22,27,40,.82)";
  cx.fillRect(18,14,330,96);
  cx.strokeStyle = "#5a6478"; cx.lineWidth = 3;
  cx.strokeRect(18,14,330,96);
  px(15); cx.textAlign="left"; cx.textBaseline="top";
  outlineText("POINTS: "+Math.round(points).toLocaleString(), 34, 30, "#e9b44c", "#3a2810", 4);
  outlineText("DISTANCE: "+(dist|0)+"m", 34, 56, "#e9b44c", "#3a2810", 4);
  for(let i=0;i<3;i++) heart(34+i*32, 82, 3, i<hearts);
  // flyer counter
  const fim = IMG["flyer"];
  cx.drawImage(fim, 152, 78, 22, 26);
  px(13); outlineText("x "+flyersEaten, 180, 86, "#efe3c4", "#20242e", 3);
  if(dodgeStreak >= 2){
    const toNext = 4 - (dodgeStreak % 4);
    px(12); cx.textAlign="left";
    outlineText("STREAK x"+dodgeStreak, 232, 86, "#7fb069", "#16281a", 3);
  }
  // active buff meters under the panel
  if(state===S.PLAY){
    let bx = 24;
    const meter = (type, frac)=>{
      cx.fillStyle = "rgba(22,27,40,.82)";
      cx.fillRect(bx-4, 118, 56, 40);
      cx.strokeStyle = "#5a6478"; cx.lineWidth = 2;
      cx.strokeRect(bx-4, 118, 56, 40);
      drawPowerupIcon(type, bx+3, 121, type==="heart"?3:3.4);
      if(frac !== null){
        cx.fillStyle = "#3a4054"; cx.fillRect(bx, 150, 48, 5);
        cx.fillStyle = ICONS[type].glow; cx.fillRect(bx, 150, Math.max(2,48*frac), 5);
      }
      bx += 66;
    };
    if(buffs.x2>0) meter("coffee", buffs.x2/600);
    if(buffs.magnet>0) meter("magnet", buffs.magnet/480);
    if(buffs.shield) meter("shield", null);
    if(slimed>0){
      cx.fillStyle = "rgba(22,27,40,.82)"; cx.fillRect(bx-4, 118, 92, 26);
      cx.strokeStyle = "#4f7a2e"; cx.lineWidth = 2; cx.strokeRect(bx-4, 118, 92, 26);
      px(10); cx.textAlign="left";
      outlineText("SLIMED", bx+4, 126, "#8fd14f", "#16281a", 3);
    }
  }
  if(mileFlash>0){
    px(16); cx.textAlign="center";
    cx.globalAlpha = Math.min(1, mileFlash/20);
    outlineText((Math.round(dist/500)*500)+"m — STILL NOT DEFUNCT!", W/2, 130, "#7fb069","#16281a",4);
    cx.globalAlpha = 1;
  }
}

function drawTitle(){
  // navy circuit backdrop
  cx.fillStyle = "#1e2433"; cx.fillRect(0,0,W,H);
  cx.strokeStyle = "rgba(90,100,120,.18)"; cx.lineWidth=2;
  for(let i=0;i<14;i++){
    const x = (i*137 + (t*.2))%W;
    cx.strokeRect(x, (i*97)%H, 60+((i*53)%90), 40+((i*31)%60));
  }
  cx.textAlign="center"; cx.textBaseline="alphabetic";
  px(44);
  outlineText("THE BRANDING ZOMBIE", W/2, 128, "#e9b44c", "#4a2f1e", 10);
  px(19);
  outlineText("VS THE MARKETING MENACE", W/2, 168, "#efe3c4", "#20242e", 6);

  // marching lineup
  const walk = IMG["walk"+((t/8|0)%5)];
  cx.drawImage(walk, 200, 226, Math.round(150*walk.width/walk.height), 150);
  const foes = ["en_badlogo","en_customer","en_officer","en_clickbait"];
  if(IMG["en_slop"] && IMG["en_slop"].width) foes.push("en_slop");
  const step = foes.length>4 ? 112 : 130, fx0 = 815 - (foes.length-1)*step/2;
  foes.forEach((k,i)=>{
    const frame = ((t/12|0)+i)%2;
    const im = IMG[k + (frame ? "_b" : "")], h = 120, w = Math.round(h*im.width/im.height);
    cx.drawImage(im, fx0+i*step - w/2, 258, w, h);
  });
  if((t/40|0)%2===0){
    px(12);
    outlineText("NEW: POWER-UPS, SPAM FLYERS & THE NIGHT SHIFT!", W/2, 208, "#7fb069", "#16281a", 4);
  }
  px(12); outlineText("HIM", 255, 402, "#7fb069", "#16281a", 4);
  outlineText("THE MENACE", 815, 402, "#c23b3b", "#2c1010", 4);

  // start button
  const pulse = 1 + Math.sin(t*.09)*.03;
  const bw = 320*pulse, bh = 58*pulse;
  cx.fillStyle = "#6b7355"; cx.fillRect(W/2-bw/2, 428-bh/2+29, bw, bh);
  cx.strokeStyle = "#3a3f2c"; cx.lineWidth=4;
  cx.strokeRect(W/2-bw/2, 428-bh/2+29, bw, bh);
  px(20); outlineText("START GAME", W/2, 468, "#efe3c4", "#2c3020", 5);

  vt(26); cx.fillStyle="#8b93a8";
  cx.fillText("JUMP: right side / space \u2014 hold to jump HIGHER     DUCK: hold left side / \u2193     Eat the AI flyers. Dodge the rest.", W/2, 516);
}

function drawOver(){
  cx.fillStyle = "rgba(12,15,24,.78)"; cx.fillRect(0,0,W,H);
  cx.textAlign="center";
  px(34); outlineText("BRAND STATUS: DEFUNCT", W/2, 128, "#c23b3b", "#2c0d0d", 9);
  vt(30); cx.fillStyle="#b8bfd0"; cx.fillText(gameOverQuip, W/2, 172);

  cx.fillStyle="rgba(30,36,51,.95)"; cx.fillRect(W/2-280,200,560,158);
  cx.strokeStyle="#5a6478"; cx.lineWidth=3; cx.strokeRect(W/2-280,200,560,158);
  px(16); cx.textAlign="left";
  outlineText("POINTS", W/2-240, 236, "#8b93a8","#161b28",3);
  outlineText("DISTANCE", W/2-240, 274, "#8b93a8","#161b28",3);
  outlineText("FLYERS EATEN", W/2-240, 312, "#8b93a8","#161b28",3);
  cx.textAlign="right";
  outlineText(Math.round(points).toLocaleString(), W/2+240, 236, "#e9b44c","#3a2810",4);
  outlineText((dist|0)+"m", W/2+240, 274, "#e9b44c","#3a2810",4);
  outlineText(""+flyersEaten, W/2+240, 312, "#e9b44c","#3a2810",4);
  px(12); cx.textAlign="center";
  outlineText("BEST: "+best.toLocaleString(), W/2, 344, "#7fb069","#16281a",3);

  const thumb = IMG["thumb"+((t/16|0)%2)];
  cx.drawImage(thumb, W/2-350-45, 210, Math.round(130*thumb.width/thumb.height), 130);

  vt(28); cx.fillStyle="#8b93a8";
  cx.fillText("Real brands don't have to die like this.", W/2, 372);
}

/* ---------- main loop ---------- */
function draw(){
  cx.save();
  if(shake>.5) cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);

  if(state===S.TITLE){ drawTitle(); cx.restore(); return; }

  drawBG();
  drawNight();

  // ambient paper scraps drifting through the office
  ambient.forEach(a=>{
    cx.globalAlpha = .55;
    cx.fillStyle = "#d8ccab";
    cx.fillRect(a.x, a.y, a.s+2, a.s);
    cx.globalAlpha = 1;
  });

  // slime puddles on the walkway
  hazards.forEach(z=>{
    cx.fillStyle = "#4f7a2e";
    cx.beginPath(); cx.ellipse(z.x+z.w/2, GROUND+8, z.w/2, z.h/2, 0, 0, 6.29); cx.fill();
    cx.fillStyle = "#8fd14f";
    cx.beginPath(); cx.ellipse(z.x+z.w/2, GROUND+6, z.w/2-6, z.h/2-4, 0, 0, 6.29); cx.fill();
    // bubbles
    cx.fillStyle = "#c8e89a";
    for(let b=0;b<3;b++){
      const bx = z.x + 18 + b*(z.w-36)/2, pop = (Math.sin(z.bub + b*2.1)+1)/2;
      cx.fillRect(bx, GROUND+2-pop*5, 4, 4);
    }
  });

  // pickups
  const fim = IMG["flyer"];
  pickups.forEach(p=>{
    const bob = Math.sin(p.wob)*5;
    cx.drawImage(p.cursed ? cursedFlyer() : fim, p.x, p.y-p.h+bob, p.w, p.h);
    if(p.cursed && (t+((p.wob*10)|0))%14<3){
      // little stink flies
      cx.fillStyle = "#5e8a34";
      cx.fillRect(p.x+p.w-4, p.y-p.h+bob-6, 3, 3);
      cx.fillRect(p.x+4, p.y-p.h+bob-2, 3, 3);
    }
  });

  // powerups: glowing pickups
  powerups.forEach(p=>{
    const bob = Math.sin(p.wob)*6;
    const ic = ICONS[p.type];
    const pulse = .16 + Math.sin(t*.12)*.06;
    cx.globalAlpha = pulse;
    cx.fillStyle = ic.glow;
    cx.beginPath(); cx.arc(p.x+p.w/2, p.y-p.h/2+bob, 34, 0, 6.29); cx.fill();
    cx.globalAlpha = 1;
    drawPowerupIcon(p.type, p.x, p.y-p.h+bob, 6);
  });

  // obstacles
  obstacles.forEach(o=>{
    const frame = ((t + o.phase)/11|0)%2;
    cx.drawImage(IMG[o.key + (frame ? "_b" : "")], o.x, o.y, o.w, o.h);
  });

  drawPlayer();

  // brand armor bubble
  if(state===S.PLAY && buffs && buffs.shield){
    const cxp = player.x + player.w/2, cyp = player.y - player.h/2;
    cx.strokeStyle = "rgba(126,200,227,"+(.5+Math.sin(t*.15)*.25).toFixed(2)+")";
    cx.lineWidth = 3;
    cx.beginPath(); cx.ellipse(cxp, cyp, player.w*.9, player.h*.72, 0, 0, 6.29); cx.stroke();
  }
  // slimed: goo pooling at the feet
  if(slimed>0){
    cx.globalAlpha = Math.min(1, slimed/40)*.8;
    cx.fillStyle = "#8fd14f";
    cx.beginPath(); cx.ellipse(player.x+player.w/2, GROUND+6, 40, 9, 0, 0, 6.29); cx.fill();
    cx.globalAlpha = 1;
  }

  // fog drifts in front of everything in the cemetery
  fogs.forEach(f=>{
    cx.globalAlpha = f.a * (1 + nightAmt()*.8);
    cx.fillStyle = "#c9d2df";
    cx.beginPath(); cx.ellipse(f.x+f.w/2, f.y, f.w/2, f.h/2, 0, 0, 6.29); cx.fill();
    cx.globalAlpha = 1;
  });

  // particles: paper scraps
  particles.forEach(p=>{
    cx.fillStyle = p.col || "#efe3c4";
    cx.fillRect(p.x, p.y, p.s, p.s);
  });
  // popups
  popups.forEach(p=>{
    px(13); cx.textAlign="center";
    cx.globalAlpha = Math.min(1, p.life/16);
    outlineText(p.txt, p.x, p.y, p.col, "#161b28", 4);
    cx.globalAlpha = 1;
  });

  // lightning flash + bolt
  if(lightning>0){
    cx.fillStyle = "rgba(240,244,255,"+(lightning/10*.26).toFixed(3)+")";
    cx.fillRect(0,0,W,H);
    if(lightning>7){
      cx.strokeStyle = "#f4f7ff"; cx.lineWidth = 4;
      const bx = 200 + ((t*97)%880);
      cx.beginPath(); cx.moveTo(bx, 0);
      cx.lineTo(bx-30, 90); cx.lineTo(bx+14, 150); cx.lineTo(bx-40, 260);
      cx.stroke();
    }
  }
  // spam sickness vignette
  if(sickTimer>0){
    cx.fillStyle = "rgba(94,168,52,"+(sickTimer/40*.22).toFixed(3)+")";
    cx.fillRect(0,0,W,H);
  }

  drawHUD();
  if(state===S.PLAY && countdown > 0){
    const sec = Math.ceil(countdown/65);
    const inSec = countdown % 65;
    const pop = 1 + Math.max(0,(inSec-50))*.06;
    cx.textAlign="center";
    px(20);
    outlineText("GET READY", W/2, 175, "#efe3c4", "#20242e", 6);
    cx.save();
    cx.translate(W/2, 285); cx.scale(pop, pop);
    px(88);
    outlineText(""+sec, 0, 30, "#e9b44c", "#4a2f1e", 14);
    cx.restore();
  }
  if(state===S.PLAY && countdown<=0 && runFrames < 40){
    cx.textAlign="center"; px(52);
    cx.globalAlpha = Math.min(1, (40-runFrames)/22);
    outlineText("GO!", W/2, 300, "#7fb069", "#16281a", 10);
    cx.globalAlpha = 1;
  }
  if(state===S.PLAY && countdown<=0 && runFrames < 300){
    cx.globalAlpha = Math.min(.85, (300-runFrames)/60);
    px(13); cx.textAlign="center";
    outlineText("HOLD \u2190 DUCK", W*.19, H-30, "#efe3c4","#20242e",4);
    outlineText("PRESS \u2192 JUMP (HOLD = HIGHER)", W*.69, H-30, "#efe3c4","#20242e",4);
    cx.strokeStyle = "rgba(239,227,196,.3)"; cx.lineWidth = 2;
    cx.setLineDash([10,8]); cx.beginPath();
    cx.moveTo(W*.38, 124); cx.lineTo(W*.38, H-14); cx.stroke(); cx.setLineDash([]);
    cx.globalAlpha = 1;
  }
  if(state===S.OVER) drawOver();
  cx.restore();
}

let bootShown = false;
function loop(){
  requestAnimationFrame(loop);
  if(loaded < toLoad){
    cx.fillStyle="#1e2433"; cx.fillRect(0,0,W,H);
    px(16); cx.textAlign="center"; cx.fillStyle="#e9b44c";
    cx.fillText("RAISING THE DEAD... "+Math.round(loaded/toLoad*100)+"%", W/2, H/2);
    return;
  }
  update();
  syncOverlay();
  draw();
}
loop();
</script>
</body>
</html>
