<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- Envelope rising out of the ground (the list, undead) -->
  <!-- Envelope body, sunk into the ground line -->
  <rect x="4" y="8" width="16" height="11" rx="1.2"/>
  <!-- Flap fold -->
  <path d="M4 9 L12 14.5 L20 9"/>
  <!-- Wax seal (toxic dot, alive) -->
  <circle cx="12" cy="14.5" r="0.9" fill="#BFFF00" stroke="none"/>
  <!-- Address lines on the face -->
  <line x1="6.5" y1="16.5" x2="10" y2="16.5" stroke-width="0.8" opacity="0.6"/>
  <line x1="6.5" y1="17.6" x2="9" y2="17.6" stroke-width="0.8" opacity="0.6"/>
  <!-- Ground line the envelope emerges from -->
  <path d="M1 20.5 Q12 21.5 23 20.5" stroke-width="1.2"/>
  <!-- Send sparks rising off the flap (signal getting out) -->
  <path d="M7 5.5 Q7.5 4.5 8.5 4.2" stroke-width="0.8" stroke="#00FFD4" opacity="0.8"/>
  <path d="M12 4.8 L12 3.2" stroke-width="0.8" stroke="#00FFD4" opacity="0.8"/>
  <path d="M17 5.5 Q16.5 4.5 15.5 4.2" stroke-width="0.8" stroke="#00FFD4" opacity="0.8"/>
</svg>
